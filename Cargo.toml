[package]
name = "dosegoose"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Sans-I/O medication reminder domain engine"

[workspace]
members = ["apps/desktop", "crates/*", "tools/uniffi-bindgen"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/altendky/dosegoose"
homepage = "https://github.com/altendky/dosegoose"

[workspace.dependencies]
dosegoose = { path = ".", version = "0.1.0" }
eframe = "0.36.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
uniffi = "0.31.2"
uuid = "1.26.1"

[dependencies]
serde.workspace = true
serde_json.workspace = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[lints]
workspace = true
